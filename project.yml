name: StarterPack

options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  defaultConfig: Development

configs:
  Development: debug
  Deployment: release

configFiles:
  Development: Configuration/Configurations/Development.xcconfig
  Deployment: Configuration/Configurations/Deployment.xcconfig

fileGroups:
  - Configuration
  - README.md

targets:
  StarterPack iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        optional: true
      - path: Resources
        optional: true
    configFiles:
      Development: Configuration/iOS/iOS-Application.xcconfig
      Deployment: Configuration/iOS/iOS-Application.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(JWW_ROOT_BUNDLE_IDENTIFIER).app
      PRODUCT_NAME: $(JWW_PROJECT_NAME)
      PRODUCT_MODULE_NAME: $(JWW_PRODUCT_MODULE_NAME)App
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - StarterPack Tests

  StarterPack Tests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: StarterPack iOS
    configFiles:
      Development: Configuration/iOS/iOS-Testing.xcconfig
      Deployment: Configuration/iOS/iOS-Testing.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(JWW_ROOT_BUNDLE_IDENTIFIER).tests
      PRODUCT_NAME: $(JWW_PROJECT_NAME) Tests
      PRODUCT_MODULE_NAME: $(JWW_PRODUCT_MODULE_NAME)Tests
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(JWW_PROJECT_NAME).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/$(JWW_PROJECT_NAME)
      BUNDLE_LOADER: $(TEST_HOST)
